<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1410"/>
      <stop offset="100%" stop-color="#5c1f1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7c873"/>
      <stop offset="50%" stop-color="#d9b545"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Kawung motif: 4 overlapping petal circles around center -->
  <g transform="translate(256,256)">
    <!-- Center dot -->
    <circle cx="0" cy="0" r="16" fill="#c9a227"/>
    <!-- 4 petals (kawung pattern) -->
    <ellipse cx="0" cy="-72" rx="48" ry="64" fill="none" stroke="#d9b545" stroke-width="5" opacity="0.9"/>
    <ellipse cx="72" cy="0" rx="64" ry="48" fill="none" stroke="#d9b545" stroke-width="5" opacity="0.9"/>
    <ellipse cx="0" cy="72" rx="48" ry="64" fill="none" stroke="#d9b545" stroke-width="5" opacity="0.9"/>
    <ellipse cx="-72" cy="0" rx="64" ry="48" fill="none" stroke="#d9b545" stroke-width="5" opacity="0.9"/>
    <!-- Inner petal details -->
    <circle cx="0" cy="-72" r="20" fill="#c9a227" opacity="0.4"/>
    <circle cx="72" cy="0" r="20" fill="#c9a227" opacity="0.4"/>
    <circle cx="0" cy="72" r="20" fill="#c9a227" opacity="0.4"/>
    <circle cx="-72" cy="0" r="20" fill="#c9a227" opacity="0.4"/>
  </g>
  <!-- Outer ring decoration -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#c9a227" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#c9a227" stroke-width="1.5" opacity="0.2"/>
</svg>
