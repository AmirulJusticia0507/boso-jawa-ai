<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a1410"/>
      <stop offset="100%" style="stop-color:#5c1f1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e7c873"/>
      <stop offset="50%" style="stop-color:#d9b545"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Kawung batik pattern (subtle) -->
  <g opacity="0.12" fill="none" stroke="#c9a227" stroke-width="3">
    <circle cx="128" cy="128" r="40"/>
    <circle cx="128" cy="128" r="56"/>
    <circle cx="384" cy="128" r="40"/>
    <circle cx="384" cy="128" r="56"/>
    <circle cx="128" cy="384" r="40"/>
    <circle cx="128" cy="384" r="56"/>
    <circle cx="384" cy="384" r="40"/>
    <circle cx="384" cy="384" r="56"/>
    <circle cx="256" cy="256" r="40"/>
    <circle cx="256" cy="256" r="56"/>
  </g>
  <!-- Javanese script: ꦧꦱ (Ba Sa) -->
  <text x="256" y="300" text-anchor="middle" font-family="serif" font-size="220" fill="url(#gold)" font-weight="bold">ꦧꦱ</text>
  <!-- Small decorative prada line -->
  <rect x="136" y="380" width="240" height="4" rx="2" fill="#c9a227" opacity="0.6"/>
</svg>
