name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
    
      - name: Install dependencies
        run: |
          cd frontend
          pnpm install
    
      - name: Run unit tests
        run: |
          cd frontend
          pnpm test
    
      - name: Build check
        run: |
          cd frontend
          pnpm run build