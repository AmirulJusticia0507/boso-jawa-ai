name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Semua nilai environment yang dipakai langkah di bawah dideklarasikan di
    # sini supaya tidak ada kredensial yang tertulis langsung di `run:`.
    env:
      DATABASE_URL: postgresql+psycopg://boso_user:boso_test_password@localhost:5432/boso_jawa_db
      AI_API_KEY: ci-dummy-key
      ADMIN_API_KEY: ci-dummy-admin-key

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: boso_user
          POSTGRES_PASSWORD: boso_test_password
          POSTGRES_DB: boso_jawa_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boso_user -d boso_jawa_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U boso_user -d boso_jawa_db; then
              echo "PostgreSQL siap setelah ${i}x2 detik"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL tidak siap dalam 60 detik"
          exit 1

      - name: Check Alembic migrations are consistent with models
        run: alembic upgrade head

      - name: Verify models and migrations are in sync
        run: |
          # Alembic tetap menulis berkas revision meski tidak ada perubahan, jadi
          # yang diperiksa adalah pesan "No changes detected".
          alembic revision --autogenerate --message "ci-drift-check" | tee /tmp/autogen.log
          if ! grep -q "No changes detected" /tmp/autogen.log; then
            echo "::error::Model berubah tanpa migration baru. Jalankan `alembic revision --autogenerate -m ...`."
            exit 1
          fi
          echo "Model dan migration sinkron."

      - name: Run tests
        run: pytest -v --tb=short
