name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: boso_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: boso_jawa_db
        ports: ["5432:5432"]
        options: >-
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
    
      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head
    
      - name: Run tests
        run: |
          cd backend
          pytest -v